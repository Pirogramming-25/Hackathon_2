{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/wrong_note.css' %}?v=3">
{% endblock %}

{% block content %}
<section class="wrong-note-section">
  <div class="wrong-note-pattern wrong-note-pattern-left"></div>
  <div class="wrong-note-pattern wrong-note-pattern-right"></div>

  <div class="container">
    <div class="wrong-note-header">
      <p class="wrong-note-eyebrow">지난 학습에서 어려웠던 부분을 모았어요</p>
      <h1>오답노트</h1>
      <p>틀린 문제는 다시 보고, 맞춘 이력도 함께 확인하며<br>자주 틀리는 부분을 쉽게 다시 연습할 수 있어요.</p>
    </div>

    <section class="history-panel" aria-labelledby="history-title">
      <h2 id="history-title">과거 학습 이력</h2>

      <div class="history-list" id="wrong-note-list"></div>
    </section>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/storage.js' %}"></script>
<script src="{% static 'js/wrong_note.js' %}"></script>
{% endblock %}
